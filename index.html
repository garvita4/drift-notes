<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift Notes</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body data-theme="overworld">

    <div class="title">DRIFT NOTES</div>
    <div class="subtitle">Write it. Release it. Watch it float away.</div>
    <div class="stats" id="stats"></div>

    <div class="top-actions">
        <button id="soundBtn" class="mc-btn icon-btn" aria-label="Toggle sound">🔊</button>
        <button id="settingsBtn" class="mc-btn icon-btn" aria-label="Settings">⚙</button>
        <button id="clearBtn" class="mc-btn">Clear</button>
    </div>

    <div id="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div id="clouds"></div>
    <div id="embers"></div>
    <div id="sky"></div>
    <div class="ground"></div>

    <div class="bottom-bar">
        <div class="swatches" id="swatches" role="group" aria-label="Note colour"></div>
        <div class="options">
            <div class="seg" id="types" role="group" aria-label="Note type"></div>
            <div class="seg" id="moods" role="group" aria-label="Mood"></div>
        </div>
        <div class="input-wrapper">
            <input type="text" id="noteInput" placeholder="Write something..." maxlength="100" autocomplete="off" />
            <button id="releaseBtn">Release</button>
        </div>
    </div>

    <div id="settings" class="overlay" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <h2 id="settingsTitle">Settings</h2>

            <label class="row"><span>Sound effects</span><input type="checkbox" id="optSound"></label>
            <label class="row"><span>Day / night cycle</span><input type="checkbox" id="optCycle"></label>
            <label class="row"><span>Pop when notes fade</span><input type="checkbox" id="optBurst"></label>
            <label class="row"><span>Drift speed <b id="speedVal"></b></span><input type="range" id="optSpeed" min="0.4"
                    max="2" step="0.1"></label>
            <label class="row"><span>Note lifetime <b id="lifeVal"></b></span><input type="range" id="optLife" min="30"
                    max="300" step="10"></label>
            <div class="row"><span>World</span>
                <div class="seg" id="themes"></div>
            </div>

            <div class="row buttons">
                <button id="exportBtn" class="mc-btn">Save sky as image</button>
                <button id="wipeBtn" class="mc-btn">Delete all notes</button>
            </div>

            <p class="hint">Hover a note to read it · click to pin it · Esc clears unpinned notes · Alt+1–8 picks a
                colour, Alt+0 = random</p>
            <button id="closeSettings" class="mc-btn">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
